name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Same-repo pushes/PRs use Brian's self-hosted runner; fork PRs stay on GitHub-hosted
    # so outside code never runs on the bedroom PC (this repo is public).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","bedroom-pc"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Show disk space
        run: df -h .

      - name: Free runner disk space (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Installs elan + the pinned toolchain and fetches the prebuilt Mathlib cache.
      # The build itself runs in the next step so its log can be audited.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: lake build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Axiom report for key theorems (Thoughts/Axioms.lean)
        run: |
          set -o pipefail
          lake env lean Thoughts/Axioms.lean 2>&1 | tee axioms.log

      - name: Axiom / sorry / native_decide gate
        run: python3 scripts/check_axioms.py build.log axioms.log

      - name: Upload axiom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axioms-report
          path: axioms.log
          if-no-files-found: warn
